const U={gh:"https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages#data-collection",ghp:"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement",um:"https://umami.is/privacy",umd:"https://umami.is/dpa",ph:"https://photon.komoot.io/",ko:"https://www.komoot.com/privacy",hg:"https://account.heigit.org/info/transparency-statement",an:"https://privacy.claude.com/en/articles/7996866-how-long-do-you-store-my-organization-s-data",ant:"https://privacy.claude.com/en/articles/7996868-is-my-data-used-for-model-training",and:"https://www.anthropic.com/legal/data-processing-addendum",cft:"https://www.cloudflare.com/turnstile-privacy-policy/",cfd:"https://www.cloudflare.com/cloudflare-customer-dpa/",rs:"https://resend.com/security/gdpr",rgpd:"https://eur-lex.europa.eu/eli/reg/2016/679/oj",loi:"https://www.ejustice.just.fgov.be/eli/loi/2018/07/30/2018040581/justel",apdfr:"https://www.autoriteprotectiondonnees.be",apdnl:"https://www.gegevensbeschermingsautoriteit.be",apden:"https://www.dataprotectionauthority.be",apdde:"https://www.datenschutzbehorde.be"};

fr:{back:"← retour",h:"Confidentialité",u:"mis à jour le 15.11.2026",
who:"Responsable",whoT:"New Don Giovanni SRL, Grand'Rue 1, 6530 Thuin · BCE BE 1036.749.658 · info@pizzeriadongiovanni.be · 0455 11 16 77.",
s:[["Hébergement","Le site est hébergé par GitHub Pages (GitHub, États-Unis). GitHub reçoit votre adresse IP quand vous ouvrez une page et l'enregistre pour la sécurité, selon [[ses conditions|gh]]. Nous n'avons pas accès à ces journaux. Base : intérêt légitime (art. 6.1.f)."],
["Statistiques, seulement avec votre accord","Si vous choisissez « Accepter », nous mesurons les visites avec Umami : page vue, provenance, taille d'écran, langue, pays, et pour une estimation de livraison la localité et la distance en km. Pas de cookie. Umami calcule un identifiant de visite à partir de votre adresse IP et de votre navigateur, sans enregistrer l'adresse IP dans les statistiques. Données conservées dans l'UE (Francfort) pendant 6 mois ; Umami (États-Unis) agit pour notre compte, selon [[ses conditions|um]]. Vous pouvez changer d'avis à tout moment avec le lien « Statistiques » en bas de page. Base : consentement (art. 6.1.a)."],
["Mémoire de votre appareil","Rien n'est enregistré avant que vous n'utilisiez une fonction. Votre navigateur garde alors : la langue, votre sélection et votre note, le choix « à emporter / livraison », l'adresse saisie avec la distance et la durée calculées, votre choix pour les statistiques (6 mois) ; pour l'assistant : la conversation (24 heures au plus), le nombre de messages sur 24 heures, le numéro de votre dernière demande (24 heures) et, en cas d'abus, la fin d'un blocage et le nombre de blocages. Il retient aussi les messages d'information que vous avez déjà vus ou fermés. Ces données restent sur votre appareil. Pas de cookies."],
["Adresse et prix de livraison","L'adresse que vous saisissez est envoyée à Photon (komoot, Allemagne) pour la trouver, puis ses coordonnées à openrouteservice (HeiGIT, Allemagne) pour calculer la distance. Ils reçoivent aussi votre adresse IP, selon leurs conditions ([[Photon|ph]], [[komoot|ko]], [[HeiGIT|hg]]). Nous ne gardons pas l'adresse. Base : votre demande (art. 6.1.b)."],
["Agent IA","Les réponses sont automatiques et peuvent contenir des erreurs. Vos messages passent par notre serveur (Cloudflare) et sont envoyés à Anthropic (États-Unis) pour produire la réponse. Anthropic agit pour notre compte, [[n'entraîne pas ses modèles|ant]] avec ces messages et les efface en principe sous 30 jours, sauf exceptions prévues par [[ses conditions|an]]. Nous ne gardons pas les conversations sur notre serveur. Si vous donnez une adresse à l'assistant, elle est traitée comme ci-dessus. Ne donnez pas de données sensibles."],
["Protection contre les robots et les abus","Cloudflare Turnstile vérifie que vous n'êtes pas un robot au premier message et avant chaque envoi, à partir de l'adresse IP et de données techniques ; Cloudflare utilise aussi ces données pour améliorer sa détection, [[sous sa propre responsabilité|cft]]. Des compteurs limitent le nombre de demandes et s'effacent après 60 secondes. Après un message hors sujet ou abusif, notre serveur garde une empreinte de votre adresse IP (non lisible directement) et l'heure, effacées 24 heures après le dernier message de ce type ; après un blocage (6 à 24 heures), 7 jours après sa fin. Base : intérêt légitime (art. 6.1.f)."],
["Demandes envoyées à la pizzeria","Nous recevons votre nom, votre e-mail vérifié par un code, votre téléphone si vous le donnez, la langue, votre note, le récapitulatif et la conversation. Si elle contient des informations de santé (allergies…), elles ne sont transmises qu'avec votre accord, donné en cochant la case du formulaire. L'e-mail est envoyé par Resend (États-Unis, [[effacé après 30 jours|rs]]) vers notre boîte hébergée par OVHcloud (France). Vous recevez une copie. Notre serveur garde 7 jours une empreinte de votre e-mail et le numéro de la demande. Nous effaçons la demande au plus tard un mois après l'événement, ou un mois après notre dernière réponse. Base : votre demande (art. 6.1.b) et, pour la santé, votre consentement (art. 9.2.a)."],
["Factures","Conservées le temps prévu par la loi (art. 6.1.c)."],
["Hors de l'Union européenne","Anthropic, Cloudflare, GitHub, Resend et Umami sont des sociétés américaines. Les transferts reposent sur le Data Privacy Framework ou sur les clauses contractuelles types, selon leurs conditions ([[Anthropic|and]], [[Cloudflare|cfd]], [[GitHub|ghp]], [[Resend|rs]], [[Umami|umd]])."],
["Vos droits","Accès, rectification, effacement, limitation, portabilité, et retrait de votre consentement à tout moment : info@pizzeriadongiovanni.be, réponse sous un mois.\n\nVous pouvez aussi vous opposer aux traitements fondés sur notre intérêt légitime.\n\nRéclamation : Autorité de protection des données, [[www.autoriteprotectiondonnees.be|apdfr]]."],
["Droit applicable","Le site est géré depuis la Belgique ; le [[RGPD|rgpd]] et la [[loi belge du 30 juillet 2018|loi]] s'appliquent. En cas de différence entre les langues, la version française prévaut."]]},
nl:{back:"← terug",h:"Privacy",u:"bijgewerkt op 15.11.2026",
who:"Verantwoordelijke",whoT:"New Don Giovanni SRL, Grand'Rue 1, 6530 Thuin · KBO BE 1036.749.658 · info@pizzeriadongiovanni.be · 0455 11 16 77.",
s:[["Hosting","De site wordt gehost door GitHub Pages (GitHub, Verenigde Staten). GitHub ontvangt uw IP-adres wanneer u een pagina opent en bewaart het voor de veiligheid, volgens [[zijn voorwaarden|gh]]. Wij hebben geen toegang tot die logbestanden. Grondslag: gerechtvaardigd belang (art. 6.1.f)."],
["Statistieken, alleen met uw akkoord","Als u « Aanvaarden » kiest, meten we de bezoeken met Umami: bekeken pagina, herkomst, schermgrootte, taal, land, en bij een schatting van de levering de plaats en de afstand in km. Geen cookie. Umami berekent een bezoek-ID op basis van uw IP-adres en uw browser, zonder het IP-adres in de statistieken op te slaan. De gegevens worden 6 maanden bewaard in de EU (Frankfurt); Umami (Verenigde Staten) handelt voor onze rekening, volgens [[zijn voorwaarden|um]]. U kunt op elk moment van mening veranderen met de link « Statistieken » onderaan de pagina. Grondslag: toestemming (art. 6.1.a)."],
["Geheugen van uw toestel","Er wordt niets opgeslagen voordat u een functie gebruikt. Uw browser bewaart dan: de taal, uw selectie en uw notitie, de keuze « afhalen / levering », het ingevoerde adres met de berekende afstand en duur, uw keuze voor de statistieken (6 maanden); voor de assistent: het gesprek (hoogstens 24 uur), het aantal berichten over 24 uur, het nummer van uw laatste aanvraag (24 uur) en, bij misbruik, het einde van een blokkering en het aantal blokkeringen. Hij onthoudt ook de informatieberichten die u al gezien of gesloten hebt. Deze gegevens blijven op uw toestel. Geen cookies."],
["Adres en leveringsprijs","Het adres dat u invoert, wordt naar Photon (komoot, Duitsland) gestuurd om het te vinden, en daarna de coördinaten naar openrouteservice (HeiGIT, Duitsland) om de afstand te berekenen. Zij ontvangen ook uw IP-adres, volgens hun voorwaarden ([[Photon|ph]], [[komoot|ko]], [[HeiGIT|hg]]). Wij bewaren het adres niet. Grondslag: uw aanvraag (art. 6.1.b)."],
["AI-agent","De antwoorden zijn automatisch en kunnen fouten bevatten. Uw berichten gaan via onze server (Cloudflare) en worden naar Anthropic (Verenigde Staten) gestuurd om het antwoord te maken. Anthropic handelt voor onze rekening, [[traint zijn modellen niet|ant]] met deze berichten en wist ze in principe binnen 30 dagen, behalve in de uitzonderingen van [[zijn voorwaarden|an]]. Wij bewaren de gesprekken niet op onze server. Als u de assistent een adres geeft, wordt het verwerkt zoals hierboven. Geef geen gevoelige gegevens."],
["Bescherming tegen robots en misbruik","Cloudflare Turnstile controleert bij het eerste bericht en vóór elke verzending dat u geen robot bent, op basis van het IP-adres en technische gegevens; Cloudflare gebruikt die gegevens ook om zijn detectie te verbeteren, [[onder eigen verantwoordelijkheid|cft]]. Tellers beperken het aantal aanvragen en worden na 60 seconden gewist. Na een bericht dat niets met de pizzeria te maken heeft of misbruik is, bewaart onze server een afdruk van uw IP-adres (niet rechtstreeks leesbaar) en het tijdstip, gewist 24 uur na het laatste bericht van dat type; na een blokkering (6 tot 24 uur), 7 dagen na het einde ervan. Grondslag: gerechtvaardigd belang (art. 6.1.f)."],
["Aanvragen aan de pizzeria","Wij ontvangen uw naam, uw e-mailadres dat met een code is gecontroleerd, uw telefoonnummer als u het geeft, de taal, uw notitie, de samenvatting en het gesprek. Als het gezondheidsinformatie bevat (allergieën…), wordt die alleen doorgegeven met uw akkoord, dat u geeft door het vakje van het formulier aan te vinken. De e-mail wordt verstuurd door Resend (Verenigde Staten, [[gewist na 30 dagen|rs]]) naar onze mailbox bij OVHcloud (Frankrijk). U ontvangt een kopie. Onze server bewaart 7 dagen een afdruk van uw e-mailadres en het nummer van de aanvraag. Wij wissen de aanvraag uiterlijk een maand na het evenement, of een maand na ons laatste antwoord. Grondslag: uw aanvraag (art. 6.1.b) en, voor gezondheid, uw toestemming (art. 9.2.a)."],
["Facturen","Bewaard zolang de wet het voorschrijft (art. 6.1.c)."],
["Buiten de Europese Unie","Anthropic, Cloudflare, GitHub, Resend en Umami zijn Amerikaanse bedrijven. De doorgiften berusten op het Data Privacy Framework of op de standaardcontractbepalingen, volgens hun voorwaarden ([[Anthropic|and]], [[Cloudflare|cfd]], [[GitHub|ghp]], [[Resend|rs]], [[Umami|umd]])."],
["Uw rechten","Inzage, rectificatie, wissing, beperking, overdraagbaarheid, en intrekking van uw toestemming op elk moment: info@pizzeriadongiovanni.be, antwoord binnen een maand.\n\nU kunt ook bezwaar maken tegen de verwerkingen die op ons gerechtvaardigd belang berusten.\n\nKlacht: Gegevensbeschermingsautoriteit, [[www.gegevensbeschermingsautoriteit.be|apdnl]]."],
["Toepasselijk recht","De site wordt vanuit België beheerd; de [[AVG|rgpd]] en de [[Belgische wet van 30 juli 2018|loi]] zijn van toepassing. Bij verschillen tussen de talen geldt de Franse versie."]]},
en:{back:"← back",h:"Privacy",u:"updated on 15.11.2026",
who:"Controller",whoT:"New Don Giovanni SRL, Grand'Rue 1, 6530 Thuin · company no. BE 1036.749.658 · info@pizzeriadongiovanni.be · 0455 11 16 77.",
s:[["Hosting","The site is hosted by GitHub Pages (GitHub, United States). GitHub receives your IP address when you open a page and records it for security, according to [[its terms|gh]]. We have no access to these logs. Basis: legitimate interest (Art. 6.1.f)."],
["Statistics, only with your agreement","If you choose “Accept”, we measure visits with Umami: page viewed, where you came from, screen size, language, country, and for a delivery estimate the town and the distance in km. No cookie. Umami calculates a visit identifier from your IP address and your browser, without recording the IP address in the statistics. Data is kept in the EU (Frankfurt) for 6 months; Umami (United States) acts on our behalf, according to [[its terms|um]]. You can change your mind at any time with the “Statistics” link at the bottom of the page. Basis: consent (Art. 6.1.a)."],
["Memory of your device","Nothing is stored before you use a function. Your browser then keeps: the language, your selection and your note, the “takeaway / delivery” choice, the address entered with the calculated distance and duration, your choice for the statistics (6 months); for the assistant: the conversation (24 hours at most), the number of messages over 24 hours, the number of your last request (24 hours) and, in case of abuse, the end of a block and the number of blocks. It also remembers the information messages you have already seen or closed. This data stays on your device. No cookies."],
["Address and delivery price","The address you enter is sent to Photon (komoot, Germany) to find it, then its coordinates to openrouteservice (HeiGIT, Germany) to calculate the distance. They also receive your IP address, according to their terms ([[Photon|ph]], [[komoot|ko]], [[HeiGIT|hg]]). We do not keep the address. Basis: your request (Art. 6.1.b)."],
["AI agent","The answers are automatic and may contain mistakes. Your messages go through our server (Cloudflare) and are sent to Anthropic (United States) to produce the answer. Anthropic acts on our behalf, [[does not train its models|ant]] with these messages and deletes them in principle within 30 days, apart from the exceptions in [[its terms|an]]. We do not keep the conversations on our server. If you give the assistant an address, it is handled as above. Do not give sensitive data."],
["Protection against robots and abuse","Cloudflare Turnstile checks that you are not a robot at the first message and before each sending, using the IP address and technical data; Cloudflare also uses this data to improve its detection, [[under its own responsibility|cft]]. Counters limit the number of requests and are deleted after 60 seconds. After an off-topic or abusive message, our server keeps a fingerprint of your IP address (not directly readable) and the time, deleted 24 hours after the last message of this kind; after a block (6 to 24 hours), 7 days after it ends. Basis: legitimate interest (Art. 6.1.f)."],
["Requests sent to the pizzeria","We receive your name, your email verified with a code, your phone number if you give it, the language, your note, the summary and the conversation. If it contains health information (allergies…), it is only passed on with your agreement, given by ticking the box in the form. The email is sent by Resend (United States, [[deleted after 30 days|rs]]) to our mailbox hosted by OVHcloud (France). You receive a copy. Our server keeps a fingerprint of your email and the request number for 7 days. We delete the request at the latest one month after the event, or one month after our last reply. Basis: your request (Art. 6.1.b) and, for health, your consent (Art. 9.2.a)."],
["Invoices","Kept for the time required by law (Art. 6.1.c)."],
["Outside the European Union","Anthropic, Cloudflare, GitHub, Resend and Umami are American companies. Transfers rely on the Data Privacy Framework or on the standard contractual clauses, according to their terms ([[Anthropic|and]], [[Cloudflare|cfd]], [[GitHub|ghp]], [[Resend|rs]], [[Umami|umd]])."],
["Your rights","Access, rectification, erasure, restriction, portability, and withdrawal of your consent at any time: info@pizzeriadongiovanni.be, reply within one month.\n\nYou can also object to processing based on our legitimate interest.\n\nComplaint: Belgian Data Protection Authority, [[www.dataprotectionauthority.be|apden]]."],
["Applicable law","The site is run from Belgium; the [[GDPR|rgpd]] and the [[Belgian law of 30 July 2018|loi]] apply. If the languages differ, the French version prevails."]]},
de:{back:"← zurück",h:"Datenschutz",u:"aktualisiert am 15.11.2026",
who:"Verantwortlicher",whoT:"New Don Giovanni SRL, Grand'Rue 1, 6530 Thuin · Unternehmensnr. BE 1036.749.658 · info@pizzeriadongiovanni.be · 0455 11 16 77.",
s:[["Hosting","Die Website wird von GitHub Pages (GitHub, USA) gehostet. GitHub erhält Ihre IP-Adresse, wenn Sie eine Seite öffnen, und speichert sie aus Sicherheitsgründen, gemäß [[seinen Bedingungen|gh]]. Wir haben keinen Zugriff auf diese Protokolle. Grundlage: berechtigtes Interesse (Art. 6.1.f)."],
["Statistik, nur mit Ihrer Zustimmung","Wenn Sie „Akzeptieren“ wählen, messen wir die Besuche mit Umami: aufgerufene Seite, Herkunft, Bildschirmgröße, Sprache, Land und bei einer Lieferschätzung den Ort und die Entfernung in km. Kein Cookie. Umami berechnet eine Besuchskennung aus Ihrer IP-Adresse und Ihrem Browser, ohne die IP-Adresse in der Statistik zu speichern. Die Daten werden 6 Monate in der EU (Frankfurt) aufbewahrt; Umami (USA) handelt in unserem Auftrag, gemäß [[seinen Bedingungen|um]]. Sie können Ihre Meinung jederzeit über den Link „Statistik“ unten auf der Seite ändern. Grundlage: Einwilligung (Art. 6.1.a)."],
["Speicher Ihres Geräts","Nichts wird gespeichert, bevor Sie eine Funktion nutzen. Ihr Browser behält dann: die Sprache, Ihre Auswahl und Ihre Notiz, die Wahl „Abholung / Lieferung“, die eingegebene Adresse mit der berechneten Entfernung und Dauer, Ihre Wahl für die Statistik (6 Monate); für den Assistenten: das Gespräch (höchstens 24 Stunden), die Zahl der Nachrichten in 24 Stunden, die Nummer Ihrer letzten Anfrage (24 Stunden) und bei Missbrauch das Ende einer Sperre und die Zahl der Sperren. Er merkt sich auch die Hinweise, die Sie schon gesehen oder geschlossen haben. Diese Daten bleiben auf Ihrem Gerät. Keine Cookies."],
["Adresse und Lieferpreis","Die Adresse, die Sie eingeben, wird an Photon (komoot, Deutschland) gesendet, um sie zu finden, dann ihre Koordinaten an openrouteservice (HeiGIT, Deutschland), um die Entfernung zu berechnen. Beide erhalten auch Ihre IP-Adresse, gemäß ihren Bedingungen ([[Photon|ph]], [[komoot|ko]], [[HeiGIT|hg]]). Wir speichern die Adresse nicht. Grundlage: Ihre Anfrage (Art. 6.1.b)."],
["KI-Agent","Die Antworten sind automatisch und können Fehler enthalten. Ihre Nachrichten laufen über unseren Server (Cloudflare) und werden an Anthropic (USA) gesendet, um die Antwort zu erzeugen. Anthropic handelt in unserem Auftrag, [[trainiert seine Modelle nicht|ant]] mit diesen Nachrichten und löscht sie grundsätzlich innerhalb von 30 Tagen, außer in den Ausnahmen gemäß [[seinen Bedingungen|an]]. Wir speichern die Gespräche nicht auf unserem Server. Wenn Sie dem Assistenten eine Adresse geben, wird sie wie oben verarbeitet. Geben Sie keine sensiblen Daten an."],
["Schutz vor Robotern und Missbrauch","Cloudflare Turnstile prüft bei der ersten Nachricht und vor jedem Versand, dass Sie kein Roboter sind, anhand der IP-Adresse und technischer Daten; Cloudflare nutzt diese Daten auch, um seine Erkennung zu verbessern, [[in eigener Verantwortung|cft]]. Zähler begrenzen die Zahl der Anfragen und werden nach 60 Sekunden gelöscht. Nach einer themenfremden oder missbräuchlichen Nachricht speichert unser Server einen Abdruck Ihrer IP-Adresse (nicht direkt lesbar) und die Uhrzeit, gelöscht 24 Stunden nach der letzten Nachricht dieser Art; nach einer Sperre (6 bis 24 Stunden) 7 Tage nach ihrem Ende. Grundlage: berechtigtes Interesse (Art. 6.1.f)."],
["Anfragen an die Pizzeria","Wir erhalten Ihren Namen, Ihre mit einem Code geprüfte E-Mail-Adresse, Ihre Telefonnummer, wenn Sie sie angeben, die Sprache, Ihre Notiz, die Zusammenfassung und das Gespräch. Wenn es Gesundheitsangaben enthält (Allergien…), werden sie nur mit Ihrer Zustimmung übermittelt, die Sie durch Ankreuzen des Kästchens im Formular geben. Die E-Mail wird von Resend (USA, [[nach 30 Tagen gelöscht|rs]]) an unser Postfach bei OVHcloud (Frankreich) gesendet. Sie erhalten eine Kopie. Unser Server speichert 7 Tage einen Abdruck Ihrer E-Mail-Adresse und die Nummer der Anfrage. Wir löschen die Anfrage spätestens einen Monat nach dem Ereignis oder einen Monat nach unserer letzten Antwort. Grundlage: Ihre Anfrage (Art. 6.1.b) und, für Gesundheit, Ihre Einwilligung (Art. 9.2.a)."],
["Rechnungen","Aufbewahrt für die gesetzlich vorgesehene Dauer (Art. 6.1.c)."],
["Außerhalb der Europäischen Union","Anthropic, Cloudflare, GitHub, Resend und Umami sind amerikanische Unternehmen. Die Übermittlungen stützen sich auf das Data Privacy Framework oder auf die Standardvertragsklauseln, gemäß ihren Bedingungen ([[Anthropic|and]], [[Cloudflare|cfd]], [[GitHub|ghp]], [[Resend|rs]], [[Umami|umd]])."],
["Ihre Rechte","Auskunft, Berichtigung, Löschung, Einschränkung, Übertragbarkeit und jederzeitiger Widerruf Ihrer Einwilligung: info@pizzeriadongiovanni.be, Antwort innerhalb eines Monats.\n\nSie können auch den Verarbeitungen widersprechen, die auf unserem berechtigten Interesse beruhen.\n\nBeschwerde: Datenschutzbehörde, [[www.datenschutzbehorde.be|apdde]]."],
["Anwendbares Recht","Die Website wird von Belgien aus betrieben; die [[DSGVO|rgpd]] und das [[belgische Gesetz vom 30. Juli 2018|loi]] gelten. Bei Unterschieden zwischen den Sprachen gilt die französische Fassung."]]},
it:{back:"← indietro",h:"Privacy",u:"aggiornata il 15.11.2026",
who:"Titolare del trattamento",whoT:"New Don Giovanni SRL, Grand'Rue 1, 6530 Thuin · n. d'impresa BE 1036.749.658 · info@pizzeriadongiovanni.be · 0455 11 16 77.",
s:[["Hosting","Il sito è ospitato da GitHub Pages (GitHub, Stati Uniti). GitHub riceve il suo indirizzo IP quando apre una pagina e lo registra per la sicurezza, secondo [[le sue condizioni|gh]]. Noi non abbiamo accesso a questi registri. Base: interesse legittimo (art. 6.1.f)."],
["Statistiche, solo con il suo accordo","Se sceglie « Accetta », misuriamo le visite con Umami: pagina vista, provenienza, dimensione dello schermo, lingua, paese e, per una stima della consegna, la località e la distanza in km. Nessun cookie. Umami calcola un identificativo di visita a partire dal suo indirizzo IP e dal suo browser, senza registrare l'indirizzo IP nelle statistiche. Dati conservati nell'UE (Francoforte) per 6 mesi; Umami (Stati Uniti) agisce per nostro conto, secondo [[le sue condizioni|um]]. Può cambiare idea in ogni momento con il link « Statistiche » in fondo alla pagina. Base: consenso (art. 6.1.a)."],
["Memoria del suo dispositivo","Niente viene registrato prima che lei usi una funzione. Il suo browser conserva allora: la lingua, la sua selezione e la sua nota, la scelta « asporto / consegna », l'indirizzo inserito con la distanza e la durata calcolate, la sua scelta per le statistiche (6 mesi); per l'assistente: la conversazione (24 ore al massimo), il numero di messaggi nelle 24 ore, il numero della sua ultima richiesta (24 ore) e, in caso di abuso, la fine di un blocco e il numero dei blocchi. Ricorda anche i messaggi informativi che ha già visto o chiuso. Questi dati restano sul suo dispositivo. Nessun cookie."],
["Indirizzo e prezzo di consegna","L'indirizzo che inserisce viene inviato a Photon (komoot, Germania) per trovarlo, poi le sue coordinate a openrouteservice (HeiGIT, Germania) per calcolare la distanza. Ricevono anche il suo indirizzo IP, secondo le loro condizioni ([[Photon|ph]], [[komoot|ko]], [[HeiGIT|hg]]). Noi non conserviamo l'indirizzo. Base: la sua richiesta (art. 6.1.b)."],
["Agente IA","Le risposte sono automatiche e possono contenere errori. I suoi messaggi passano dal nostro server (Cloudflare) e sono inviati ad Anthropic (Stati Uniti) per produrre la risposta. Anthropic agisce per nostro conto, [[non addestra i suoi modelli|ant]] con questi messaggi e li cancella in linea di principio entro 30 giorni, salvo le eccezioni previste dalle [[sue condizioni|an]]. Noi non conserviamo le conversazioni sul nostro server. Se dà un indirizzo all'assistente, viene trattato come sopra. Non dia dati sensibili."],
["Protezione contro i robot e gli abusi","Cloudflare Turnstile verifica che lei non sia un robot al primo messaggio e prima di ogni invio, a partire dall'indirizzo IP e da dati tecnici; Cloudflare usa questi dati anche per migliorare il suo riconoscimento, [[sotto la propria responsabilità|cft]]. Dei contatori limitano il numero di richieste e si cancellano dopo 60 secondi. Dopo un messaggio fuori tema o abusivo, il nostro server conserva un'impronta del suo indirizzo IP (non leggibile direttamente) e l'ora, cancellate 24 ore dopo l'ultimo messaggio di questo tipo; dopo un blocco (da 6 a 24 ore), 7 giorni dopo la sua fine. Base: interesse legittimo (art. 6.1.f)."],
["Richieste inviate alla pizzeria","Riceviamo il suo nome, la sua email verificata con un codice, il suo telefono se lo indica, la lingua, la sua nota, il riepilogo e la conversazione. Se contiene informazioni sulla salute (allergie…), sono trasmesse solo con il suo accordo, dato spuntando la casella del modulo. L'email è inviata da Resend (Stati Uniti, [[cancellata dopo 30 giorni|rs]]) alla nostra casella ospitata da OVHcloud (Francia). Lei riceve una copia. Il nostro server conserva per 7 giorni un'impronta della sua email e il numero della richiesta. Cancelliamo la richiesta al più tardi un mese dopo l'evento, o un mese dopo la nostra ultima risposta. Base: la sua richiesta (art. 6.1.b) e, per la salute, il suo consenso (art. 9.2.a)."],
["Fatture","Conservate per il tempo previsto dalla legge (art. 6.1.c)."],
["Fuori dall'Unione europea","Anthropic, Cloudflare, GitHub, Resend e Umami sono società americane. I trasferimenti si basano sul Data Privacy Framework o sulle clausole contrattuali tipo, secondo le loro condizioni ([[Anthropic|and]], [[Cloudflare|cfd]], [[GitHub|ghp]], [[Resend|rs]], [[Umami|umd]])."],
["I suoi diritti","Accesso, rettifica, cancellazione, limitazione, portabilità e revoca del suo consenso in ogni momento: info@pizzeriadongiovanni.be, risposta entro un mese.\n\nPuò anche opporsi ai trattamenti basati sul nostro interesse legittimo.\n\nReclamo: Autorità belga per la protezione dei dati, [[www.autoriteprotectiondonnees.be|apdfr]]."],
["Diritto applicabile","Il sito è gestito dal Belgio; si applicano il [[GDPR|rgpd]] e la [[legge belga del 30 luglio 2018|loi]]. In caso di differenze tra le lingue prevale la versione francese."]]},
es:{back:"← volver",h:"Privacidad",u:"actualizada el 15.11.2026",
who:"Responsable",whoT:"New Don Giovanni SRL, Grand'Rue 1, 6530 Thuin · n.º de empresa BE 1036.749.658 · info@pizzeriadongiovanni.be · 0455 11 16 77.",
s:[["Alojamiento","El sitio está alojado en GitHub Pages (GitHub, Estados Unidos). GitHub recibe su dirección IP cuando abre una página y la registra por seguridad, según [[sus condiciones|gh]]. No tenemos acceso a esos registros. Base: interés legítimo (art. 6.1.f)."],
["Estadísticas, solo con su acuerdo","Si elige « Aceptar », medimos las visitas con Umami: página vista, procedencia, tamaño de pantalla, idioma, país y, para una estimación de reparto, la localidad y la distancia en km. Ninguna cookie. Umami calcula un identificador de visita a partir de su dirección IP y de su navegador, sin registrar la dirección IP en las estadísticas. Datos conservados en la UE (Fráncfort) durante 6 meses; Umami (Estados Unidos) actúa por nuestra cuenta, según [[sus condiciones|um]]. Puede cambiar de opinión en cualquier momento con el enlace « Estadísticas » al final de la página. Base: consentimiento (art. 6.1.a)."],
["Memoria de su dispositivo","No se guarda nada antes de que use una función. Su navegador conserva entonces: el idioma, su selección y su nota, la elección « para llevar / reparto », la dirección introducida con la distancia y la duración calculadas, su elección para las estadísticas (6 meses); para el asistente: la conversación (24 horas como máximo), el número de mensajes en 24 horas, el número de su última solicitud (24 horas) y, en caso de abuso, el fin de un bloqueo y el número de bloqueos. También recuerda los mensajes informativos que ya ha visto o cerrado. Estos datos se quedan en su dispositivo. Sin cookies."],
["Dirección y precio de reparto","La dirección que introduce se envía a Photon (komoot, Alemania) para encontrarla, y después sus coordenadas a openrouteservice (HeiGIT, Alemania) para calcular la distancia. También reciben su dirección IP, según sus condiciones ([[Photon|ph]], [[komoot|ko]], [[HeiGIT|hg]]). No guardamos la dirección. Base: su solicitud (art. 6.1.b)."],
["Agente de IA","Las respuestas son automáticas y pueden contener errores. Sus mensajes pasan por nuestro servidor (Cloudflare) y se envían a Anthropic (Estados Unidos) para producir la respuesta. Anthropic actúa por nuestra cuenta, [[no entrena sus modelos|ant]] con estos mensajes y los borra en principio en 30 días, salvo las excepciones previstas en [[sus condiciones|an]]. No guardamos las conversaciones en nuestro servidor. Si da una dirección al asistente, se trata como se indica arriba. No dé datos sensibles."],
["Protección contra robots y abusos","Cloudflare Turnstile comprueba que usted no es un robot en el primer mensaje y antes de cada envío, a partir de la dirección IP y de datos técnicos; Cloudflare también usa esos datos para mejorar su detección, [[bajo su propia responsabilidad|cft]]. Unos contadores limitan el número de solicitudes y se borran a los 60 segundos. Tras un mensaje fuera de tema o abusivo, nuestro servidor guarda una huella de su dirección IP (no legible directamente) y la hora, borradas 24 horas después del último mensaje de ese tipo; tras un bloqueo (de 6 a 24 horas), 7 días después de su fin. Base: interés legítimo (art. 6.1.f)."],
["Solicitudes enviadas a la pizzería","Recibimos su nombre, su correo verificado con un código, su teléfono si lo indica, el idioma, su nota, el resumen y la conversación. Si contiene información de salud (alergias…), solo se transmite con su acuerdo, dado al marcar la casilla del formulario. El correo lo envía Resend (Estados Unidos, [[borrado a los 30 días|rs]]) a nuestro buzón alojado en OVHcloud (Francia). Usted recibe una copia. Nuestro servidor guarda 7 días una huella de su correo y el número de la solicitud. Borramos la solicitud como máximo un mes después del evento, o un mes después de nuestra última respuesta. Base: su solicitud (art. 6.1.b) y, para la salud, su consentimiento (art. 9.2.a)."],
["Facturas","Conservadas el tiempo previsto por la ley (art. 6.1.c)."],
["Fuera de la Unión Europea","Anthropic, Cloudflare, GitHub, Resend y Umami son empresas estadounidenses. Las transferencias se basan en el Data Privacy Framework o en las cláusulas contractuales tipo, según sus condiciones ([[Anthropic|and]], [[Cloudflare|cfd]], [[GitHub|ghp]], [[Resend|rs]], [[Umami|umd]])."],
["Sus derechos","Acceso, rectificación, supresión, limitación, portabilidad y retirada de su consentimiento en cualquier momento: info@pizzeriadongiovanni.be, respuesta en un mes.\n\nTambién puede oponerse a los tratamientos basados en nuestro interés legítimo.\n\nReclamación: Autoridad belga de Protección de Datos, [[www.autoriteprotectiondonnees.be|apdfr]]."],
["Derecho aplicable","El sitio se gestiona desde Bélgica; se aplican el [[RGPD|rgpd]] y la [[ley belga del 30 de julio de 2018|loi]]. En caso de diferencias entre los idiomas prevalece la versión francesa."]]}

let L=new URLSearchParams(location.search).get("l")||LS.get("dg_lang")||(navigator.language||"fr").slice(0,2);if(!T[L])L="fr";
function draw(){const t=T[L];document.documentElement.lang=L;document.title=t.h+" · Pizzeria Don Giovanni";
 document.querySelector(".back").textContent=t.back;
 document.getElementById("langs").innerHTML=Object.keys(T).map(k=>`<button type="button" data-l="${k}" class="${k===L?"on":""}">${k.toUpperCase()}</button>`).join(" ");
 document.getElementById("c").innerHTML=`<h1>${esc(t.h)}</h1><p class="muted"><small>${esc(t.u)}</small></p><div class="box"><b>${esc(t.who)}</b><br>${esc(t.whoT)}</div>`+t.s.map(([a,b])=>`<h2>${esc(a)}</h2>`+b.split("\n\n").map(x=>`<p>${lk(x)}</p>`).join("")).join("")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(b){L=b.dataset.l;LS.set("dg_lang",L);draw()}});
draw();
