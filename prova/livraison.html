<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Livraison Don Giovanni</title>
<meta name="robots" content="noindex">
<meta name="description" content="Tarifs de livraison de la Pizzeria Don Giovanni, Thuin : prix selon les km et le nombre de pizzas.">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" href="icon-512.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{--bg:#ffffff;--fg:#17120f;--muted:#5f5650;--line:#ddd3c8;--red:#c8231c;--green:#1f8a4c;--zebra:#f7f2ec;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.flag{display:grid;grid-template-columns:1fr 1fr 1fr;height:6px}.flag i:nth-child(1){background:var(--green)}.flag i:nth-child(2){background:#eee}.flag i:nth-child(3){background:var(--red)}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.b{font:600 13px Poppins,system-ui,sans-serif;border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:999px;padding:7px 13px;cursor:pointer;text-decoration:none}
.b[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
header{display:flex;gap:16px;align-items:center;margin:14px 0 14px;border-bottom:3px solid var(--red);padding-bottom:10px}
header img{width:70px;height:auto}
h1{margin:0;font-size:22px;line-height:1.15;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:center}
th{background:var(--fg);color:#fff;font-weight:600;font-size:12.5px}
th:first-child,td:first-child{text-align:left;padding-left:10px}
td:first-child{font-weight:600}
tbody tr:nth-child(even) td{background:var(--zebra)}
td.f{color:var(--green);font-weight:600}
tr.big td{background:#fde9e7!important;text-align:left}
tr.no td{color:var(--muted);text-align:left}
ul.notes{margin:14px 0 0;padding-left:20px}ul.notes li{margin:4px 0}
.foot{margin-top:12px;color:var(--muted);font-size:12.5px}
td.m{color:var(--red);font-weight:700;white-space:nowrap}.disc{margin:14px 0 0;color:var(--muted);font-size:12px;line-height:1.4}
@media (max-width:560px){table{font-size:12.5px}th{font-size:10px}th,td{padding:8px 3px}th:first-child,td:first-child{padding-left:6px}header img{width:48px}h1{font-size:19px}header p{font-size:11.5px}}
/* schermo: caratteri più grandi (10.11.2026, per chi vede meno bene) */
body{font-size:17px}h1{font-size:26px}header p{font-size:14px}header img{width:84px}table{font-size:17px}th{font-size:14px}td{padding:13px 6px}td.f{font-size:15px}ul.notes li{margin:8px 0}.disc{font-size:14px}.foot{font-size:14px}
@media (max-width:560px){body{font-size:16px}table{font-size:15px}td:first-child{font-size:13px}td.m{font-size:12px}th{font-size:11.5px}th,td{padding:11px 3px}td.f{font-size:12.5px}h1{font-size:22px}header img{width:56px}header p{font-size:12px}.disc{font-size:13px}}
@media (max-width:360px){table{font-size:13px}td.f{font-size:11px}th{font-size:10.5px}}
@media print{@page{size:A4;margin:12mm}.noprint{display:none!important}.wrap{max-width:none;padding:0}.tw{border:0}}
@media print{body{font-size:12.5pt}header{margin:5mm 0 6mm}header img{width:100px}h1{font-size:26pt}header p{font-size:11pt}table{font-size:13pt}thead th:first-child{width:27%!important}th{font-size:10.5pt;padding:9px 4px}td{padding:12px 4px}td.f{font-size:11.5pt}ul.notes{margin-top:6mm}ul.notes li{margin:7px 0}.disc{font-size:10pt;margin-top:7mm}.foot{font-size:10pt}}

th.pz{white-space:nowrap;line-height:1.25}th.pz .pn{font-size:1.15em}
table{table-layout:fixed}thead th:first-child{width:31%}td.f{overflow-wrap:anywhere;font-size:.92em}@media (max-width:560px){td.f{font-size:11px}}
thead th:first-child{width:19%!important}thead th:nth-child(n+2):nth-child(-n+4){width:12%}thead th:nth-child(n+5){width:15%}td.f{overflow-wrap:normal;white-space:nowrap}
@media (max-width:340px){th,td{padding:7px 2px}td.f{font-size:9.5px}th.pz{font-size:10.5px}}</style></head><body>

if 2 – 4 km.", "Die Entfernung wird in « Meine Auswahl » <b>automatisch berechnet</b>, wenn Sie Ihre Adresse eingeben. Der Preis wird telefonisch bestätigt.", "Zum Mitnehmen ist es immer möglich!"], "upd": "Aktualisiert"}, "es": {"min3": "mín. 3", "disc": "Precios y tarifas de entrega sujetos a cambios sin previo aviso. Son válidas las tarifas indicadas en este sitio en el momento del pedido.", "title": "Tarifas de entrega", "back": "← Menú", "print": "Imprimir", "dist": "Distancia por carretera", "pz": ["2 pizzas", "3 pizzas", "4 pizzas", "5 pizzas", "6 pizzas", "7+ pizzas"], "free": "gratis", "city": "Thuin ciudad · hasta 2 km", "km": "km", "big": "Solo pedidos grandes (15–20 pizzas), por teléfono", "no": "Sin entrega", "more15": "más de 15 km", "notes": ["Mínimo <b>2 pizzas o pastas</b> hasta 8 km, <b>3</b> de 8 a 12 km.", "Entrega de <b>jueves a domingo, 17:30 – 21:30</b>.", "Cuentan pizzas y pastas (no los postres ni las bebidas). Fuera de Thuin: como mínimo la tarifa 2 – 4 km.", "La distancia se <b>calcula automáticamente</b> en « Mi selección » cuando escribes tu dirección. El precio se confirma por teléfono.", "¡Para llevar, siempre es posible!"], "upd": "Actualizada"}, "it": {"min3": "min. 3", "disc": "Prezzi e tariffe di consegna possono cambiare senza preavviso. Valgono le tariffe indicate su questo sito al momento dell'ordine.", "title": "Tariffe di consegna", "back": "← Menu", "print": "Stampa", "dist": "Distanza su strada", "pz": ["2 pizze", "3 pizze", "4 pizze", "5 pizze", "6 pizze", "7+ pizze"], "free": "gratuita", "city": "Thuin città · fino a 2 km", "km": "km", "big": "Solo ordini grandi (15–20 pizze), su chiamata", "no": "Nessuna consegna", "more15": "oltre 15 km", "notes": ["Minimo <b>2 pizze o paste</b> fino a 8 km, <b>3</b> da 8 a 12 km.", "Consegna <b>dal giovedì alla domenica, 17:30 – 21:30</b>.", "Contano pizze e paste (non dolci o bevande). Fuori Thuin: almeno la tariffa 2 – 4 km.", "La distanza è <b>calcolata automaticamente</b> in « La mia selezione » quando scrivi il tuo indirizzo. Il prezzo è confermato al telefono.", "Da asporto si può sempre!"], "upd": "Aggiornata"}},UPD="10/11/2026";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let L="fr";try{const s=localStorage.getItem("dg_lang");if(UI[s])L=s;else{const n=(navigator.language||"fr").slice(0,2);if(UI[n])L=n}}catch(e){}
const eur=v=>L==="en"?"€"+v:v+" €";
function lab(k,u){if(k==="city")return u.city;const [a,b]=k.split("-");return a+" – "+b+" "+u.km}
function draw(){const u=UI[L];document.documentElement.lang=L;document.getElementById("h1").textContent=u.title;document.title=u.title+" · Don Giovanni";
 document.getElementById("back").textContent=u.back;document.getElementById("pr").textContent=u.print;
 document.getElementById("langs").innerHTML=["fr","nl","de","it","en","es"].map(l=>`<button class="b" type="button" data-l="${l}" aria-pressed="${l===L}">${l.toUpperCase()}</button>`).join("");
 const head=`<tr><th>${esc(u.dist)}</th>${u.pz.map(p=>{const i=p.indexOf(" ");return `<th class="pz"><span class="pn">${esc(p.slice(0,i))}</span><br>${esc(p.slice(i+1))}</th>`}).join("")}</tr>`;
 const body=ROWS.map(([k,ps])=>`<tr><td>${esc(lab(k,u))}</td>${ps.map(v=>v==null?`<td class="f">${esc(u.free)}</td>`:v==="-"?`<td class="m">${esc(u.min3)}</td>`:`<td>${eur(v)}</td>`).join("")}</tr>`).join("")
  +`<tr class="big"><td>12 – 15 ${u.km}</td><td colspan="6"><b>${esc(u.big)}</b></td></tr><tr class="no"><td>${esc(u.more15)}</td><td colspan="6">${esc(u.no)}</td></tr>`;
 document.getElementById("main").innerHTML=`<div class="tw"><table class="l-${L}"><thead>${head}</thead><tbody>${body}</tbody></table></div><ul class="notes">${u.notes.map(n=>`<li>${n}</li>`).join("")}</ul><p class="disc">${esc(u.disc)}</p><p class="foot">${esc(u.upd)} : ${UPD}</p>`}
