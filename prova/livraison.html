<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Livraison Don Giovanni</title>
<meta name="robots" content="noindex">
<meta name="description" content="Tarifs de livraison de la Pizzeria Don Giovanni, Thuin : prix selon les km et le nombre de pizzas.">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" href="icon-512.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<style>
:root{--bg:#ffffff;--fg:#17120f;--muted:#5f5650;--line:#ddd3c8;--red:#c8231c;--green:#1f8a4c;--zebra:#f7f2ec;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.flag{display:grid;grid-template-columns:1fr 1fr 1fr;height:6px}.flag i:nth-child(1){background:var(--green)}.flag i:nth-child(2){background:#eee}.flag i:nth-child(3){background:var(--red)}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.b{font:600 13px Poppins,system-ui,sans-serif;border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:999px;padding:7px 13px;cursor:pointer;text-decoration:none}
.b[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
header{display:flex;gap:16px;align-items:center;margin:14px 0 14px;border-bottom:3px solid var(--red);padding-bottom:10px}
header img{width:70px;height:auto}
h1{margin:0;font-size:22px;line-height:1.15;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:center}
th{background:var(--fg);color:#fff;font-weight:600;font-size:12.5px}
th:first-child,td:first-child{text-align:left;padding-left:10px}
td:first-child{font-weight:600}
tbody tr:nth-child(even) td{background:var(--zebra)}
td.f{color:var(--green);font-weight:600}
tr.big td{background:#fde9e7!important;text-align:left}
tr.no td{color:var(--muted);text-align:left}
ul.notes{margin:14px 0 0;padding-left:20px}ul.notes li{margin:4px 0}
.foot{margin-top:12px;color:var(--muted);font-size:12.5px}
@media (max-width:560px){table{font-size:12.5px}th{font-size:11px}th,td{padding:8px 3px}th:first-child,td:first-child{padding-left:6px}header img{width:48px}h1{font-size:19px}header p{font-size:11.5px}}
@media print{@page{size:A4;margin:12mm}.noprint{display:none!important}.wrap{max-width:none;padding:0}.tw{border:0}}
</style></head><body>
<div class="flag"><i></i><i></i><i></i></div>
<div class="wrap">
<div class="top noprint"><a class="b" id="back" href="index.html"></a><div class="btns" id="langs"></div><button class="b" id="pr" type="button" hidden></button></div>
<header><img src="logo-light.png" alt="Pizzeria Don Giovanni"><div><h1 id="h1"></h1><p>Pizzeria Don Giovanni · Grand'Rue 1 · 6530 Thuin · Tél. 0455 11 16 77</p></div></header>
<div id="main"></div>
</div>
<script>
const ROWS=[["city", [3, 3, 3, null, null]], ["3-4", [4, 4, 3, null, null]], ["4-6", [5, 4, 3, null, null]], ["6-8", [6, 5, 4, null, null]], ["8-10", [7, 6, 5, null, null]], ["10-11", [8, 8, 8, 8, null]]],UI={"fr": {"title": "Tarifs de livraison", "back": "← Menu", "print": "Imprimer", "dist": "Distance par la route", "pz": ["2 pizzas", "3 pizzas", "4 pizzas", "5 pizzas", "6+ pizzas"], "free": "gratuite", "city": "Thuin ville · jusqu'à 3 km", "km": "km", "big": "Uniquement grandes commandes (15–20 pizzas), sur appel", "no": "Pas de livraison", "more15": "plus de 15 km", "notes": ["Minimum <b>2 pizzas</b> par livraison.", "Livraison du <b>jeudi au dimanche, 17h30 – 21h30</b>.", "Seules les <b>pizzas</b> comptent pour le nombre de pizzas (pas les pâtes, desserts ni boissons).", "La distance est <b>calculée automatiquement</b> dans « Ma sélection » quand vous écrivez votre adresse. Le prix est confirmé au téléphone.", "À emporter, c'est toujours possible !"], "upd": "Mise à jour"}, "nl": {"title": "Leveringstarieven", "back": "← Menu", "print": "Afdrukken", "dist": "Afstand via de weg", "pz": ["2 pizza's", "3 pizza's", "4 pizza's", "5 pizza's", "6+ pizza's"], "free": "gratis", "city": "Thuin stad · tot 3 km", "km": "km", "big": "Enkel grote bestellingen (15–20 pizza's), op aanvraag", "no": "Geen levering", "more15": "meer dan 15 km", "notes": ["Minimum <b>2 pizza's</b> per levering.", "Levering van <b>donderdag tot zondag, 17u30 – 21u30</b>.", "Enkel <b>pizza's</b> tellen mee voor het aantal (geen pasta, desserts of dranken).", "De afstand wordt <b>automatisch berekend</b> in « Mijn selectie » wanneer u uw adres invult. De prijs wordt telefonisch bevestigd.", "Afhalen kan altijd!"], "upd": "Bijgewerkt"}, "en": {"title": "Delivery prices", "back": "← Menu", "print": "Print", "dist": "Distance by road", "pz": ["2 pizzas", "3 pizzas", "4 pizzas", "5 pizzas", "6+ pizzas"], "free": "free", "city": "Thuin town · up to 3 km", "km": "km", "big": "Large orders only (15–20 pizzas), by phone", "no": "No delivery", "more15": "over 15 km", "notes": ["Minimum <b>2 pizzas</b> per delivery.", "Delivery <b>Thursday to Sunday, 5:30 pm – 9:30 pm</b>.", "Only <b>pizzas</b> count towards the number of pizzas (not pasta, desserts or drinks).", "The distance is <b>calculated automatically</b> in “My selection” when you enter your address. The price is confirmed by phone.", "Takeaway is always possible!"], "upd": "Updated"}, "de": {"title": "Liefertarife", "back": "← Menü", "print": "Drucken", "dist": "Entfernung über die Straße", "pz": ["2 Pizzen", "3 Pizzen", "4 Pizzen", "5 Pizzen", "6+ Pizzen"], "free": "kostenlos", "city": "Thuin Stadt · bis 3 km", "km": "km", "big": "Nur große Bestellungen (15–20 Pizzen), auf Anfrage", "no": "Keine Lieferung", "more15": "über 15 km", "notes": ["Mindestens <b>2 Pizzen</b> pro Lieferung.", "Lieferung <b>Donnerstag bis Sonntag, 17:30 – 21:30 Uhr</b>.", "Nur <b>Pizzen</b> zählen für die Anzahl (keine Pasta, Desserts oder Getränke).", "Die Entfernung wird in « Meine Auswahl » <b>automatisch berechnet</b>, wenn Sie Ihre Adresse eingeben. Der Preis wird telefonisch bestätigt.", "Zum Mitnehmen ist es immer möglich!"], "upd": "Aktualisiert"}, "es": {"title": "Tarifas de entrega", "back": "← Menú", "print": "Imprimir", "dist": "Distancia por carretera", "pz": ["2 pizzas", "3 pizzas", "4 pizzas", "5 pizzas", "6+ pizzas"], "free": "gratis", "city": "Thuin ciudad · hasta 3 km", "km": "km", "big": "Solo pedidos grandes (15–20 pizzas), por teléfono", "no": "Sin entrega", "more15": "más de 15 km", "notes": ["Mínimo <b>2 pizzas</b> por entrega.", "Entrega de <b>jueves a domingo, 17:30 – 21:30</b>.", "Solo cuentan las <b>pizzas</b> para el número de pizzas (no la pasta, los postres ni las bebidas).", "La distancia se <b>calcula automáticamente</b> en « Mi selección » cuando escribes tu dirección. El precio se confirma por teléfono.", "¡Para llevar, siempre es posible!"], "upd": "Actualizada"}, "it": {"title": "Tariffe di consegna", "back": "← Menu", "print": "Stampa", "dist": "Distanza su strada", "pz": ["2 pizze", "3 pizze", "4 pizze", "5 pizze", "6+ pizze"], "free": "gratuita", "city": "Thuin città · fino a 3 km", "km": "km", "big": "Solo ordini grandi (15–20 pizze), su chiamata", "no": "Nessuna consegna", "more15": "oltre 15 km", "notes": ["Minimo <b>2 pizze</b> per consegna.", "Consegna <b>dal giovedì alla domenica, 17:30 – 21:30</b>.", "Contano solo le <b>pizze</b> per il numero di pizze (non pasta, dolci o bevande).", "La distanza è <b>calcolata automaticamente</b> in « La mia selezione » quando scrivi il tuo indirizzo. Il prezzo è confermato al telefono.", "Da asporto si può sempre!"], "upd": "Aggiornata"}},UPD="04/11/2026";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let L="fr";try{const s=localStorage.getItem("dg_lang");if(UI[s])L=s;else{const n=(navigator.language||"fr").slice(0,2);if(UI[n])L=n}}catch(e){}
const eur=v=>L==="en"?"€"+v:v+" €";
function lab(k,u){if(k==="city")return u.city;const [a,b]=k.split("-");return a+" – "+b+" "+u.km}
function draw(){const u=UI[L];document.documentElement.lang=L;document.getElementById("h1").textContent=u.title;document.title=u.title+" · Don Giovanni";
 document.getElementById("back").textContent=u.back;document.getElementById("pr").textContent=u.print;
 document.getElementById("langs").innerHTML=["fr","nl","de","it","en","es"].map(l=>`<button class="b" type="button" data-l="${l}" aria-pressed="${l===L}">${l.toUpperCase()}</button>`).join("");
 const head=`<tr><th>${esc(u.dist)}</th>${u.pz.map(p=>`<th>${esc(p)}</th>`).join("")}</tr>`;
 const body=ROWS.map(([k,ps])=>`<tr><td>${esc(lab(k,u))}</td>${ps.map(v=>v==null?`<td class="f">${esc(u.free)}</td>`:`<td>${eur(v)}</td>`).join("")}</tr>`).join("")
  +`<tr class="big"><td>11 – 15 ${u.km}</td><td colspan="5"><b>${esc(u.big)}</b></td></tr><tr class="no"><td>${esc(u.more15)}</td><td colspan="5">${esc(u.no)}</td></tr>`;
 document.getElementById("main").innerHTML=`<div class="tw"><table><thead>${head}</thead><tbody>${body}</tbody></table></div><ul class="notes">${u.notes.map(n=>`<li>${n}</li>`).join("")}</ul><p class="foot">${esc(u.upd)} : ${UPD}</p>`}
document.addEventListener("click",e=>{const l=e.target.closest("[data-l]");if(l){L=l.dataset.l;try{localStorage.setItem("dg_lang",L)}catch(_){ }draw()}});
try{if(window.self===window.top){const pr=document.getElementById("pr");pr.hidden=false;pr.onclick=()=>window.print()}}catch(e){}
draw();
</script></body></html>
