const T={
fr:{back:"← retour",h:"Confidentialité",u:"Site et assistant « Assistance » · mis à jour le 14.11.2026",
who:"Responsable",whoT:"New Don Giovanni SRL (Pizzeria Don Giovanni), Grand'Rue 1, 6530 Thuin · BCE BE 1036.749.658 · info@pizzeriadongiovanni.be · 0455 11 16 77.",
s:[["Statistiques","Statistiques de visite anonymes (Umami), sans cookies et sans identifier les visiteurs."],
["Agent IA « Assistance »","Vos messages passent par notre serveur (Cloudflare) et sont envoyés à Anthropic (Claude) uniquement pour produire la réponse. Nous ne gardons pas les conversations. Anthropic les efface automatiquement dans les 30 jours et ne les utilise pas pour entraîner ses modèles. Ne partagez pas de données sensibles (données bancaires, détails de santé…) : pour connaître les allergènes d'un plat, il suffit de demander, sans donner d'informations personnelles."],
["Adresse et prix de livraison","Si vous donnez une adresse pour connaître le prix de livraison, elle est envoyée à Photon (komoot) et openrouteservice (HeiGIT) pour calculer la distance, sans votre nom. Pour nos statistiques anonymes (Umami), nous gardons seulement le nom de la rue (sans numéro), la localité, le code postal et la distance arrondie au kilomètre."],
["Protection anti-robot", "Cloudflare Turnstile vérifie que vous n'êtes pas un robot à partir de données techniques du navigateur et de l'adresse IP. Pas de cookies publicitaires. En cas d'abus répétés, notre serveur garde une empreinte illisible de votre adresse IP pour bloquer l'assistant (de 6 à 24 heures). Il l'efface 24 heures après le dernier abus, ou 7 jours après la fin d'un blocage."],
["Mémoire du navigateur","Pour votre confort, votre navigateur garde sur votre appareil : la langue choisie, votre sélection et votre note, le choix « à emporter / livraison » et l'adresse saisie pour estimer la livraison. Ces données restent sur votre appareil et ne nous sont pas envoyées. En cas d'abus, il garde aussi l'heure de fin d'un blocage temporaire de l'assistant (6 à 24 heures). Pas de cookies. Vous pouvez tout effacer en vidant les données du site dans votre navigateur."],
["Petit cadeau caché", "Après quelques instants de visite, le site demande à notre serveur (Cloudflare) s'il y a un bon cadeau caché. Avant de donner un bon, le contrôle anti-robot Turnstile de Cloudflare vérifie que vous n'êtes pas un robot. Aucun identifiant n'est créé. Si vous recevez un bon, notre serveur garde une empreinte illisible de votre adresse IP pendant 7 jours, seulement pour qu'une même connexion ne reçoive pas plusieurs bons, puis l'efface automatiquement. Si vous touchez « Enregistrer mon bon », votre navigateur garde ce bon sur votre appareil jusqu'à sa date de fin. Aucun nom, aucune autre donnée."],
["Demandes envoyées à la pizzeria","Si vous envoyez une demande (fête, groupe…), nous recevons votre nom, téléphone, e-mail (vérifié par un code) le récapitulatif et votre note éventuelle, par l'intermédiaire de Resend (serveurs dans l'Union européenne). Ces données servent uniquement à vous répondre. Nous les effaçons au plus tard un mois après l'événement (ou après notre réponse s'il n'y a pas de suite). Si la demande devient une commande avec facture, la facture est gardée le temps prévu par la loi."],
["Base légale","Répondre à vos questions et à vos demandes avant une commande (art. 6.1.b RGPD) et protéger le site contre les abus et offrir les bons cadeaux du site (intérêt légitime, art. 6.1.f RGPD)."],
["Hors de l'Union européenne","Anthropic, Cloudflare et Resend sont des sociétés américaines : certaines données peuvent être traitées hors de l'UE, avec les garanties prévues par le RGPD (clauses contractuelles types)."],
["Vos droits","Vous pouvez demander l'accès, la correction ou l'effacement de vos données, ou vous y opposer : info@pizzeriadongiovanni.be. Vous pouvez aussi porter plainte auprès de l'Autorité de protection des données (www.autoriteprotectiondonnees.be)."]]},
nl:{back:"← terug",h:"Privacy",u:"Website en assistent « Hulp » · bijgewerkt op 14.11.2026",who:"Verantwoordelijke",whoT:"New Don Giovanni SRL (Pizzeria Don Giovanni), Grand'Rue 1, 6530 Thuin · KBO BE 1036.749.658 · info@pizzeriadongiovanni.be · 0455 11 16 77.",
s:[["Statistieken","Anonieme bezoekersstatistieken (Umami), zonder cookies en zonder bezoekers te identificeren."],
["AI-agent « Hulp »","Uw berichten gaan via onze server (Cloudflare) naar Anthropic (Claude), alleen om het antwoord te maken. Wij bewaren de gesprekken niet. Anthropic wist ze automatisch binnen 30 dagen en gebruikt ze niet om modellen te trainen. Deel geen gevoelige gegevens (bankgegevens, gezondheidsdetails…): om de allergenen van een gerecht te kennen, volstaat het te vragen, zonder persoonlijke informatie."],
["Adres en leveringsprijs","Als u een adres geeft voor de leveringsprijs, wordt het naar Photon (komoot) en openrouteservice (HeiGIT) gestuurd om de afstand te berekenen, zonder uw naam. Voor onze anonieme statistieken (Umami) bewaren wij alleen de straatnaam (zonder huisnummer), de plaats, de postcode en de afstand afgerond op de kilometer."],
["Bescherming tegen robots", "Cloudflare Turnstile controleert met technische browsergegevens en het IP-adres dat u geen robot bent. Geen reclamecookies. Bij herhaald misbruik bewaart onze server een onleesbare vingerafdruk van uw IP-adres om de assistent te blokkeren (van 6 tot 24 uur). Hij wist die 24 uur na het laatste misbruik, of 7 dagen na het einde van een blokkering."],
["Geheugen van de browser","Voor uw gemak bewaart uw browser op uw toestel: de gekozen taal, uw selectie en uw opmerking, de keuze « afhalen / levering » en het adres dat u invult om de levering te schatten. Deze gegevens blijven op uw toestel en worden niet naar ons verzonden. Bij misbruik bewaart hij ook het einde van een tijdelijke blokkering van de assistent (6 tot 24 uur). Geen cookies. U kunt alles wissen door de gegevens van de site in uw browser te verwijderen."],
["Verborgen cadeautje", "Na enkele ogenblikken bezoek vraagt de site aan onze server (Cloudflare) of er een verborgen cadeaubon is. Voordat een bon wordt gegeven, controleert Turnstile van Cloudflare dat u geen robot bent. Er wordt geen identificatiecode aangemaakt. Krijgt u een bon, dan bewaart onze server 7 dagen lang een onleesbare vingerafdruk van uw IP-adres, alleen zodat eenzelfde verbinding niet meerdere bonnen krijgt, en wist die daarna automatisch. Als u op « Mijn bon bewaren » tikt, houdt uw browser die bon op uw toestel tot de einddatum. Geen naam, geen andere gegevens."],
["Aanvragen naar de pizzeria","Als u een aanvraag stuurt (feest, groep…), ontvangen wij uw naam, telefoon, e-mail (gecontroleerd met een code) de samenvatting en uw eventuele opmerking, via Resend (servers in de Europese Unie). Deze gegevens dienen alleen om u te antwoorden. Wij wissen ze uiterlijk een maand na het evenement (of na ons antwoord als er geen vervolg is). Wordt het een bestelling met factuur, dan wordt de factuur zo lang bewaard als de wet vraagt."],
["Rechtsgrond","Uw vragen en aanvragen beantwoorden vóór een bestelling (art. 6.1.b AVG) en de website beschermen tegen misbruik en de cadeaubonnen van de website aanbieden (gerechtvaardigd belang, art. 6.1.f AVG)."],
["Buiten de Europese Unie","Anthropic, Cloudflare en Resend zijn Amerikaanse bedrijven: sommige gegevens kunnen buiten de EU verwerkt worden, met de waarborgen van de AVG (standaardcontractbepalingen)."],
["Uw rechten","U kunt inzage, correctie of wissing van uw gegevens vragen, of bezwaar maken: info@pizzeriadongiovanni.be. U kunt ook klacht indienen bij de Gegevensbeschermingsautoriteit (www.gegevensbeschermingsautoriteit.be)."]]},
en:{back:"← back",h:"Privacy",u:"Website and « Help » assistant · updated 14.11.2026",who:"Controller",whoT:"New Don Giovanni SRL (Pizzeria Don Giovanni), Grand'Rue 1, 6530 Thuin · company no. BE 1036.749.658 · info@pizzeriadongiovanni.be · 0455 11 16 77.",
s:[["Statistics","Anonymous visit statistics (Umami), no cookies and no identification of visitors."],
["AI agent « Help »","Your messages go through our server (Cloudflare) to Anthropic (Claude), only to produce the answer. We do not keep conversations. Anthropic deletes them automatically within 30 days and does not use them to train its models. Do not share sensitive data (bank details, health details…): to know the allergens of a dish, just ask, without giving personal information."],
["Address and delivery price","If you give an address to get the delivery price, it is sent to Photon (komoot) and openrouteservice (HeiGIT) to calculate the distance, without your name. For our anonymous statistics (Umami), we only keep the street name (without house number), the town, the postcode and the distance rounded to the kilometre."],
["Bot protection", "Cloudflare Turnstile checks that you are not a robot using technical browser data and your IP address. No advertising cookies. In case of repeated abuse, our server keeps an unreadable fingerprint of your IP address to block the assistant (from 6 to 24 hours). It deletes it 24 hours after the last abuse, or 7 days after a block ends."],
["Browser memory","For your convenience, your browser keeps on your device: the chosen language, your selection and your note, the « takeaway / delivery » choice and the address entered to estimate delivery. This data stays on your device and is not sent to us. In case of abuse, it also keeps the end time of a temporary block of the assistant (6 to 24 hours). No cookies. You can erase everything by clearing the site data in your browser."],
["Little hidden gift", "After a few moments on the site, the page asks our server (Cloudflare) whether there is a hidden gift voucher. Before a voucher is given, Cloudflare's Turnstile check makes sure you are not a robot. No identifier is created. If you get a voucher, our server keeps an unreadable fingerprint of your IP address for 7 days, only so that the same connection does not get several vouchers, then deletes it automatically. If you tap « Save my voucher », your browser keeps that voucher on your device until its end date. No name, no other data."],
["Requests sent to the pizzeria","If you send a request (party, group…), we receive your name, phone, e-mail (checked with a code) the summary and your note, if any, through Resend (servers in the European Union). This data is only used to reply to you. We delete it at the latest one month after the event (or after our reply if nothing follows). If the request becomes an order with an invoice, the invoice is kept as long as the law requires."],
["Legal basis","Answering your questions and requests before an order (art. 6.1.b GDPR) and protecting the site against abuse and offering the site's gift vouchers (legitimate interest, art. 6.1.f GDPR)."],
["Outside the European Union","Anthropic, Cloudflare and Resend are US companies: some data may be processed outside the EU, with the safeguards required by the GDPR (standard contractual clauses)."],
["Your rights","You can ask for access, correction or deletion of your data, or object: info@pizzeriadongiovanni.be. You can also complain to the Belgian Data Protection Authority (www.dataprotectionauthority.be)."]]},
de:{back:"← zurück",h:"Datenschutz",u:"Website und Assistent « Hilfe » · aktualisiert am 14.11.2026",who:"Verantwortlicher",whoT:"New Don Giovanni SRL (Pizzeria Don Giovanni), Grand'Rue 1, 6530 Thuin · Unternehmensnr. BE 1036.749.658 · info@pizzeriadongiovanni.be · 0455 11 16 77.",
s:[["Statistiken","Anonyme Besuchsstatistiken (Umami), ohne Cookies und ohne Besucher zu identifizieren."],
["KI-Agent « Hilfe »","Ihre Nachrichten gehen über unseren Server (Cloudflare) an Anthropic (Claude), nur um die Antwort zu erstellen. Wir speichern die Gespräche nicht. Anthropic löscht sie automatisch innerhalb von 30 Tagen und nutzt sie nicht zum Trainieren seiner Modelle. Teilen Sie keine sensiblen Daten (Bankdaten, Gesundheitsdetails…): Um die Allergene eines Gerichts zu erfahren, fragen Sie einfach, ohne persönliche Angaben."],
["Adresse und Lieferpreis","Wenn Sie eine Adresse für den Lieferpreis angeben, wird sie an Photon (komoot) und openrouteservice (HeiGIT) gesendet, um die Entfernung zu berechnen, ohne Ihren Namen. Für unsere anonymen Statistiken (Umami) speichern wir nur den Straßennamen (ohne Hausnummer), den Ort, die Postleitzahl und die auf den Kilometer gerundete Entfernung."],
["Schutz vor Robotern", "Cloudflare Turnstile prüft anhand technischer Browserdaten und der IP-Adresse, dass Sie kein Roboter sind. Keine Werbe-Cookies. Bei wiederholtem Missbrauch speichert unser Server einen unlesbaren Fingerabdruck Ihrer IP-Adresse, um den Assistenten zu sperren (6 bis 24 Stunden). Er löscht ihn 24 Stunden nach dem letzten Missbrauch oder 7 Tage nach Ende einer Sperre."],
["Speicher des Browsers","Für Ihren Komfort speichert Ihr Browser auf Ihrem Gerät: die gewählte Sprache, Ihre Auswahl und Ihre Notiz, die Wahl « Abholung / Lieferung » und die Adresse, die Sie zur Schätzung der Lieferung eingeben. Diese Daten bleiben auf Ihrem Gerät und werden nicht an uns gesendet. Bei Missbrauch speichert er auch das Ende einer vorübergehenden Sperre des Assistenten (6 bis 24 Stunden). Keine Cookies. Sie können alles löschen, indem Sie die Website-Daten in Ihrem Browser entfernen."],
["Verstecktes Geschenk", "Nach einigen Augenblicken Besuch fragt die Website unseren Server (Cloudflare), ob ein versteckter Gutschein bereitliegt. Bevor ein Gutschein vergeben wird, prüft Turnstile von Cloudflare, dass Sie kein Roboter sind. Es wird keine Kennung erzeugt. Erhalten Sie einen Gutschein, speichert unser Server 7 Tage lang einen unlesbaren Fingerabdruck Ihrer IP-Adresse, nur damit dieselbe Verbindung nicht mehrere Gutscheine erhält, und löscht ihn danach automatisch. Wenn Sie auf « Gutschein speichern » tippen, behält Ihr Browser diesen Gutschein bis zum Enddatum auf Ihrem Gerät. Kein Name, keine anderen Daten."],
["Anfragen an die Pizzeria","Wenn Sie eine Anfrage senden (Feier, Gruppe…), erhalten wir Ihren Namen, Telefon, E-Mail (per Code geprüft) die Zusammenfassung und Ihre eventuelle Notiz, über Resend (Server in der Europäischen Union). Diese Daten dienen nur der Antwort. Wir löschen sie spätestens einen Monat nach dem Ereignis (oder nach unserer Antwort, wenn nichts folgt). Wird daraus eine Bestellung mit Rechnung, wird die Rechnung so lange aufbewahrt, wie das Gesetz es verlangt."],
["Rechtsgrundlage","Beantwortung Ihrer Fragen und Anfragen vor einer Bestellung (Art. 6.1.b DSGVO) und Schutz der Website vor Missbrauch und Vergabe der Gutscheine der Website (berechtigtes Interesse, Art. 6.1.f DSGVO)."],
["Außerhalb der Europäischen Union","Anthropic, Cloudflare und Resend sind US-Unternehmen: Einige Daten können außerhalb der EU verarbeitet werden, mit den Garantien der DSGVO (Standardvertragsklauseln)."],
["Ihre Rechte","Sie können Auskunft, Berichtigung oder Löschung Ihrer Daten verlangen oder widersprechen: info@pizzeriadongiovanni.be. Sie können sich auch bei der belgischen Datenschutzbehörde beschweren (www.datenschutzbehorde.be)."]]},
it:{back:"← indietro",h:"Privacy",u:"Sito e assistente « Assistenza » · aggiornato il 14.11.2026",who:"Titolare del trattamento",whoT:"New Don Giovanni SRL (Pizzeria Don Giovanni), Grand'Rue 1, 6530 Thuin · BCE BE 1036.749.658 · info@pizzeriadongiovanni.be · 0455 11 16 77.",
s:[["Statistiche","Statistiche di visita anonime (Umami), senza cookie e senza identificare i visitatori."],
["Agente IA « Assistenza »","I tuoi messaggi passano dal nostro server (Cloudflare) e vanno ad Anthropic (Claude) solo per creare la risposta. Non conserviamo le conversazioni. Anthropic le cancella automaticamente entro 30 giorni e non le usa per addestrare i suoi modelli. Non condividere dati sensibili (dati bancari, dettagli sulla salute…): per conoscere gli allergeni di un piatto basta chiedere, senza dare informazioni personali."],
["Indirizzo e prezzo della consegna","Se dai un indirizzo per sapere il prezzo della consegna, viene inviato a Photon (komoot) e openrouteservice (HeiGIT) per calcolare la distanza, senza il tuo nome. Per le nostre statistiche anonime (Umami) conserviamo solo il nome della via (senza numero civico), la località, il codice postale e la distanza arrotondata al chilometro."],
["Protezione anti-robot", "Cloudflare Turnstile verifica che tu non sia un robot con dati tecnici del browser e l'indirizzo IP. Nessun cookie pubblicitario. In caso di abusi ripetuti, il nostro server conserva un'impronta illeggibile del tuo indirizzo IP per bloccare l'assistente (da 6 a 24 ore). La cancella 24 ore dopo l'ultimo abuso, o 7 giorni dopo la fine di un blocco."],
["Memoria del browser","Per tua comodità il tuo browser conserva sul tuo dispositivo: la lingua scelta, la tua selezione e la tua nota, la scelta « da asporto / consegna » e l'indirizzo scritto per stimare la consegna. Questi dati restano sul tuo dispositivo e non ci vengono inviati. In caso di abuso conserva anche l'ora di fine di un blocco temporaneo dell'assistente (da 6 a 24 ore). Nessun cookie. Puoi cancellare tutto eliminando i dati del sito nel tuo browser."],
["Piccolo regalo nascosto", "Dopo qualche istante di visita il sito chiede al nostro server (Cloudflare) se c'è un buono regalo nascosto. Prima di dare un buono, il controllo anti-robot Turnstile di Cloudflare verifica che tu non sia un robot. Non viene creato nessun identificativo. Se ricevi un buono, il nostro server conserva per 7 giorni un'impronta illeggibile del tuo indirizzo IP, solo perché la stessa connessione non riceva più buoni, poi la cancella automaticamente. Se tocchi « Salva il mio buono », il tuo browser conserva quel buono sul tuo dispositivo fino alla sua scadenza. Nessun nome, nessun altro dato."],
["Richieste inviate alla pizzeria","Se invii una richiesta (festa, gruppo…), riceviamo nome, telefono, email (verificata con un codice) il riepilogo e l'eventuale nota personale, tramite Resend (server nell'Unione europea). Questi dati servono solo a risponderti. Li cancelliamo al più tardi un mese dopo l'evento (o dopo la nostra risposta se non c'è seguito). Se la richiesta diventa un ordine con fattura, la fattura è conservata per il tempo previsto dalla legge."],
["Base giuridica","Rispondere alle tue domande e richieste prima di un ordine (art. 6.1.b GDPR) e proteggere il sito dagli abusi e offrire i buoni regalo del sito (interesse legittimo, art. 6.1.f GDPR)."],
["Fuori dall'Unione europea","Anthropic, Cloudflare e Resend sono società americane: alcuni dati possono essere trattati fuori dall'UE, con le garanzie previste dal GDPR (clausole contrattuali tipo)."],
["I tuoi diritti","Puoi chiedere accesso, correzione o cancellazione dei tuoi dati, oppure opporti: info@pizzeriadongiovanni.be. Puoi anche presentare reclamo all'Autorità belga per la protezione dei dati (www.autoriteprotectiondonnees.be)."]]},
es:{back:"← volver",h:"Privacidad",u:"Sitio y asistente « Ayuda » · actualizado el 14.11.2026",who:"Responsable",whoT:"New Don Giovanni SRL (Pizzeria Don Giovanni), Grand'Rue 1, 6530 Thuin · n.º de empresa BE 1036.749.658 · info@pizzeriadongiovanni.be · 0455 11 16 77.",
s:[["Estadísticas","Estadísticas de visitas anónimas (Umami), sin cookies y sin identificar a los visitantes."],
["Agente IA « Ayuda »","Sus mensajes pasan por nuestro servidor (Cloudflare) y se envían a Anthropic (Claude) solo para crear la respuesta. No guardamos las conversaciones. Anthropic las borra automáticamente en 30 días y no las usa para entrenar sus modelos. No comparta datos sensibles (datos bancarios, detalles de salud…): para conocer los alérgenos de un plato, basta con preguntar, sin dar información personal."],
["Dirección y precio de entrega","Si indica una dirección para conocer el precio de entrega, se envía a Photon (komoot) y openrouteservice (HeiGIT) para calcular la distancia, sin su nombre. Para nuestras estadísticas anónimas (Umami), solo guardamos el nombre de la calle (sin número), la localidad, el código postal y la distancia redondeada al kilómetro."],
["Protección contra robots", "Cloudflare Turnstile comprueba que no es un robot con datos técnicos del navegador y la dirección IP. Sin cookies publicitarias. En caso de abusos repetidos, nuestro servidor guarda una huella ilegible de su dirección IP para bloquear el asistente (de 6 a 24 horas). La borra 24 horas después del último abuso, o 7 días después del fin de un bloqueo."],
["Memoria del navegador","Para su comodidad, su navegador guarda en su dispositivo: el idioma elegido, su selección y su nota, la opción « para llevar / entrega » y la dirección introducida para estimar la entrega. Estos datos permanecen en su dispositivo y no se nos envían. En caso de abuso, guarda también la hora de fin de un bloqueo temporal del asistente (de 6 a 24 horas). Sin cookies. Puede borrarlo todo eliminando los datos del sitio en su navegador."],
["Pequeño regalo escondido", "Tras unos instantes de visita, la web pregunta a nuestro servidor (Cloudflare) si hay un vale regalo escondido. Antes de dar un vale, el control anti-robot Turnstile de Cloudflare comprueba que usted no es un robot. No se crea ningún identificador. Si recibe un vale, nuestro servidor guarda durante 7 días una huella ilegible de su dirección IP, solo para que una misma conexión no reciba varios vales, y luego la borra automáticamente. Si toca « Guardar mi vale », su navegador conserva ese vale en su dispositivo hasta su fecha de fin. Ningún nombre, ningún otro dato."],
["Solicitudes enviadas a la pizzería","Si envía una solicitud (fiesta, grupo…), recibimos su nombre, teléfono, correo (verificado con un código) el resumen y su nota, si la hay, a través de Resend (servidores en la Unión Europea). Estos datos solo sirven para responderle. Los borramos como máximo un mes después del evento (o después de nuestra respuesta si no hay continuación). Si la solicitud se convierte en un pedido con factura, la factura se conserva el tiempo que exige la ley."],
["Base jurídica","Responder a sus preguntas y solicitudes antes de un pedido (art. 6.1.b RGPD) y proteger el sitio contra abusos y ofrecer los vales regalo del sitio (interés legítimo, art. 6.1.f RGPD)."],
["Fuera de la Unión Europea","Anthropic, Cloudflare y Resend son empresas estadounidenses: algunos datos pueden tratarse fuera de la UE, con las garantías del RGPD (cláusulas contractuales tipo)."],
["Sus derechos","Puede pedir el acceso, la corrección o el borrado de sus datos, u oponerse: info@pizzeriadongiovanni.be. También puede reclamar ante la Autoridad belga de Protección de Datos (www.autoriteprotectiondonnees.be)."]]}

 document.querySelector(".back").textContent=t.back;
 document.getElementById("langs").innerHTML=Object.keys(T).map(k=>`<button type="button" data-l="${k}" class="${k===L?"on":""}">${k.toUpperCase()}</button>`).join(" ");
 document.getElementById("c").innerHTML=`<h1>${esc(t.h)}</h1><p class="muted"><small>${esc(t.u)}</small></p><div class="box"><b>${esc(t.who)}</b><br>${esc(t.whoT)}</div>`+t.s.map(([a,b])=>`<h2>${esc(a)}</h2><p>${esc(b)}</p>`).join("")}
document.addEventListener("click",e=>{const b=e.target.closest("[data-l]");if(b){L=b.dataset.l;LS.set("dg_lang",L);draw()}});
draw();
</script>
</body>
</html>
